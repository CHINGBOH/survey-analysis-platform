# .hermes/config.yaml — Hermes Agent 项目配置
# 此文件告诉 Hermes 如何处理 survey-analysis-platform 项目

project:
  name: "survey-analysis-platform"
  description: "问卷调查数据分析平台 — 弱耦合模块化 SPSS 风格统计管道"

pipeline:
  # 清洗步骤
  clean:
    command: "make clean"
    description: "Excel → SQLite 清洗入库"
  # 分析步骤（可单独运行）
  analyze:
    command: "make analyze"
    description: "运行所有 SPSS 统计分析模块"
    modules:
      - descriptives
      - crosstabs
      - ttest
      - anova
      - correlation
      - reliability
      - factor_analysis
      - regression
      - mediation
      - moderation
      - cluster
      - power_bootstrap
  # 整合
  integrate:
    command: "make integrate"
  # 报告
  report:
    command: "make report"
    output: "output/reports/survey_analysis_report.html"

skills:
  # 使用内置技能
  - survey-questionnaire-statistics  # 全指标参考
  - survey-data-cleaning-pipeline     # 清洗管道
  - survey-advanced-analysis          # 高级分析
  - spss-statistics-reference         # SPSS 输出格式参考

tools:
  primary: [terminal, file, write_file, search_files]
  analysis: [terminal, execute_code]
